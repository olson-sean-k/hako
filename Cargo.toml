[package]
name = "hako"
version = "0.0.0"
rust-version = "1.75.0"
edition = "2021"
authors = ["Sean Olson <olson.sean.k@gmail.com>"]
description = "Monospaced text layouts using composable blocks."
repository = "https://github.com/olson-sean-k/hako"
readme = "README.md"
license = "MIT"
keywords = [
    "layout",
    "terminal",
    "text",
    "tui",
]

[features]
default = ["owo-colors"]
owo-colors = ["dep:owo-colors"]

[dependencies]
ascii = "^1.1.0"
derive-where = "^1.2.0"
itertools = "^0.10.0"
supports-color = "^2.0.0"
supports-unicode = "^2.0.0"
terminal_size = "^0.3.0"
unicode-properties = "^0.1.1"
unicode-segmentation = "^1.8.0"
unicode-width = "^0.1.0"

[dependencies.owo-colors]
version = "^4.1.0"
optional = true
